name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  # The end-to-end job is gated on this event as well as the schedule, so that
  # a maintainer can run the network tests on demand before cutting a release
  # rather than waiting for the nightly.
  workflow_dispatch:
  schedule:
    # Nightly, so the network-dependent end-to-end tests run against the real
    # registries without slowing down every pull request.
    - cron: "0 4 * * *"

jobs:
  # ── Ubuntu (22.04 / 24.04) × (gcc / clang) + macOS ──────────────────────────
  build:
    name: ${{ matrix.os }} / ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,  cc: gcc }
          - { os: ubuntu-24.04,  cc: gcc }
          - { os: ubuntu-22.04,  cc: clang }
          - { os: ubuntu-24.04,  cc: clang }
          - { os: macos-latest,  cc: clang }

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake ${{ matrix.cc }} \
            libcurl4-openssl-dev libssl-dev libarchive-dev libcjson-dev

      - name: Install dependencies (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          brew install cmake curl openssl@3 libarchive cjson
          # Record keg-only prefixes for CMake's PREFIX_PATH
          echo "CURL_PREFIX=$(brew --prefix curl)"           >> "$GITHUB_ENV"
          echo "SSL_PREFIX=$(brew --prefix openssl@3)"       >> "$GITHUB_ENV"
          echo "ARCHIVE_PREFIX=$(brew --prefix libarchive)"  >> "$GITHUB_ENV"

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
        run: |
          EXTRA_PATHS=""
          if [[ -n "${CURL_PREFIX:-}" ]]; then
            EXTRA_PATHS="${CURL_PREFIX};${SSL_PREFIX};${ARCHIVE_PREFIX};/opt/homebrew"
          fi

          CMAKE_ARGS="-DCMAKE_BUILD_TYPE=Debug"
          if [[ -n "$EXTRA_PATHS" ]]; then
            CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_PREFIX_PATH=$EXTRA_PATHS"
          fi

          cmake -B build $CMAKE_ARGS

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test (--help)
        run: ./build/packmule --help

      - name: Smoke test (missing -f is an error)
        run: |
          if ./build/packmule 2>/dev/null; then
            echo "Expected non-zero exit when -f is missing" && exit 1
          fi
          echo "OK: exited non-zero as expected"

      - name: Smoke test (verify rejects a bundle it cannot check)
        run: |
          mkdir -p /tmp/emptybundle
          if ./build/packmule verify /tmp/emptybundle 2>/dev/null; then
            echo "Expected non-zero exit with no SHA256SUMS" && exit 1
          fi
          echo "OK: exited non-zero as expected"

      # Argument and environment validation is entirely offline, so it belongs
      # on every push rather than in the nightly network job.  Each of these
      # guards a way a run could otherwise fail late, confusingly, or by
      # leaking a credential.
      - name: Smoke test (invalid option values are rejected)
        run: |
          set -eu
          printf 'requests\n' > /tmp/req.txt
          expect_fail() {
            desc="$1"; shift
            if "$@" >/dev/null 2>&1; then
              echo "FAIL: expected non-zero exit: $desc" && exit 1
            fi
            echo "OK: $desc"
          }
          expect_fail "--sbom rejects an unknown format" \
            ./build/packmule -f /tmp/req.txt --sbom yaml -n
          expect_fail "--index rejects an unknown mode" \
            ./build/packmule -f /tmp/req.txt --index html -n
          expect_fail "--jobs rejects an out-of-range value" \
            ./build/packmule -f /tmp/req.txt -j 99 -n

      - name: Smoke test (credentials are never sent somewhere unintended)
        run: |
          set -eu
          printf 'requests\n' > /tmp/req.txt
          expect_fail() {
            desc="$1"; shift
            if env "$@" >/dev/null 2>&1; then
              echo "FAIL: expected non-zero exit: $desc" && exit 1
            fi
            echo "OK: $desc"
          }
          # Credentials with no --repo-url would otherwise silently build the
          # bundle from the public index.
          expect_fail "credentials without --repo-url are fatal" \
            PACKMULE_TOKEN=t ./build/packmule -f /tmp/req.txt -n
          # Cleartext transport, without the explicit opt-out.
          expect_fail "credentials over http are refused" \
            PACKMULE_TOKEN=t ./build/packmule -f /tmp/req.txt \
              -u http://example.invalid/simple -n
          # A secret in the URL would be echoed into logs.
          expect_fail "userinfo in --repo-url is refused" \
            ./build/packmule -f /tmp/req.txt \
              -u https://u:p@example.invalid/simple -n
          # Half a credential pair fails now rather than as an opaque 401.
          expect_fail "an incomplete credential pair is fatal" \
            PACKMULE_USERNAME=u ./build/packmule -f /tmp/req.txt \
              -u https://example.invalid/simple -n
          # A raw header is the escape hatch for unknown registries; a newline
          # in it would inject further headers.  $'...' keeps the newline off
          # this file, where it would end the YAML block scalar.
          expect_fail "a newline in PACKMULE_AUTH_HEADER is refused" \
            PACKMULE_AUTH_HEADER=$'X-Api-Key: a\nX-Evil: 1' \
            ./build/packmule -f /tmp/req.txt \
              -u https://example.invalid/simple -n
          # Two schemes at once is ambiguous.
          expect_fail "conflicting auth schemes are fatal" \
            PACKMULE_AUTH_HEADER='X-Api-Key: a' PACKMULE_TOKEN=t \
            ./build/packmule -f /tmp/req.txt -u https://example.invalid/simple -n
          # A mistyped CA path must fail at startup, not as a TLS error later.
          expect_fail "a missing CA bundle is reported at startup" \
            PACKMULE_CA_BUNDLE=/nonexistent/ca.pem \
            ./build/packmule -f /tmp/req.txt -n

  # ── Sanitizers ──────────────────────────────────────────────────────────────
  #
  # Most of this codebase is hand-rolled parsing of untrusted input (XML,
  # version strings, wheel filenames), which is exactly the shape of code that
  # goes wrong in ways a passing test suite does not reveal.  ASan + UBSan on
  # every push is the cheapest insurance available.
  sanitizers:
    name: sanitizers (asan+ubsan)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake clang \
            libcurl4-openssl-dev libssl-dev libarchive-dev libcjson-dev

      - name: Configure
        env:
          CC: clang
        run: |
          cmake -B build-asan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DPACKMULE_WERROR=OFF \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined -g"

      - name: Build
        run: cmake --build build-asan --parallel

      - name: Test under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-asan --output-on-failure

  # ── Shell lint ──────────────────────────────────────────────────────────────
  #
  # The install scripts ship inside every bundle and the e2e scripts are the
  # only thing checking the pipeline end to end, so both are linted on every
  # push.  This runs on its own rather than alongside a C analysis step, so a
  # failure in one never hides the other.
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck

      - name: shellcheck the install and e2e scripts
        run: shellcheck -s sh scripts/*.sh tests/e2e/*.sh

  # ── Fedora (latest) / GCC — run inside a Fedora container ───────────────────
  build-fedora:
    name: fedora-latest / gcc
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install -y \
            cmake gcc libcurl-devel openssl-devel libarchive-devel \
            cjson-devel gzip

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test (--help)
        run: ./build/packmule --help

  # ── End-to-end against the real registries ──────────────────────────────────
  #
  # Network-dependent, so nightly and on demand rather than per-push.  These
  # are the only tests that exercise the whole pipeline through to an actual
  # offline install, which is the thing users care about.
  e2e:
    name: end-to-end (network)
    runs-on: ubuntu-24.04
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake gcc \
            libcurl4-openssl-dev libssl-dev libarchive-dev libcjson-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DPACKMULE_E2E_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run end-to-end tests
        run: ctest --test-dir build -L e2e --output-on-failure
