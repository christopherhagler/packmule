name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux / GCC ────────────────────────────────────────────────────
          - os: ubuntu-22.04
            cc: gcc
          - os: ubuntu-24.04
            cc: gcc
          # ── Linux / Clang ──────────────────────────────────────────────────
          - os: ubuntu-22.04
            cc: clang
          - os: ubuntu-24.04
            cc: clang
          # ── macOS / Apple Clang ────────────────────────────────────────────
          - os: macos-latest
            cc: clang

    steps:
      - uses: actions/checkout@v4

      # ── Install dependencies ──────────────────────────────────────────────
      - name: Install dependencies (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake \
            ${{ matrix.cc }} \
            libcurl4-openssl-dev \
            libssl-dev \
            libarchive-dev \
            libcjson-dev

      - name: Install dependencies (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          brew install cmake curl openssl@3 libarchive cjson
          # Record keg-only prefixes for CMake's PREFIX_PATH
          echo "CURL_PREFIX=$(brew --prefix curl)"           >> "$GITHUB_ENV"
          echo "SSL_PREFIX=$(brew --prefix openssl@3)"       >> "$GITHUB_ENV"
          echo "ARCHIVE_PREFIX=$(brew --prefix libarchive)"  >> "$GITHUB_ENV"

      # ── Configure ─────────────────────────────────────────────────────────
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
        run: |
          EXTRA_PATHS=""
          if [[ -n "${CURL_PREFIX:-}" ]]; then
            EXTRA_PATHS="${CURL_PREFIX};${SSL_PREFIX};${ARCHIVE_PREFIX};/opt/homebrew"
          fi

          CMAKE_ARGS="-DCMAKE_BUILD_TYPE=Debug"
          if [[ -n "$EXTRA_PATHS" ]]; then
            CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_PREFIX_PATH=$EXTRA_PATHS"
          fi

          cmake -B build $CMAKE_ARGS

      # ── Build ──────────────────────────────────────────────────────────────
      - name: Build
        run: cmake --build build --parallel

      # ── Test ───────────────────────────────────────────────────────────────
      - name: Test
        run: ctest --test-dir build --output-on-failure

      # ── Smoke-test the binary ──────────────────────────────────────────────
      - name: Smoke test (--help)
        run: ./build/packmule --help || true   # exits 0; just check it runs

      - name: Smoke test (missing -r flag)
        run: |
          if ./build/packmule 2>/dev/null; then
            echo "Expected non-zero exit when -r is missing" && exit 1
          fi
          echo "OK: exited non-zero as expected"
